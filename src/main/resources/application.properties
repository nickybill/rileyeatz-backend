# =====================================================
# RILEYEATZ BACKEND - PRODUCTION CONFIG (RENDER)
# =====================================================

# ===============================
# SERVER CONFIG
# ===============================
server.port=${PORT:8080}
server.error.include-message=always

# ===============================
# DATABASE CONFIG (Render PostgreSQL)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# CONNECTION POOL (HikariCP)
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# ===============================
# JWT CONFIG
# ===============================
app.jwt.secret=${JWT_SECRET:ChangeThisSecretKeyInProduction}
app.jwt.expiration=86400000

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO

# ===============================
# CORS (If needed for Android/Web)
# ===============================
# Configure CORS inside SecurityConfig class